name: Generate Trophy
on:
  schedule:
    - cron: "0 0 * * *"   # Se ejecuta diariamente a medianoche
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Permite guardar y hacer push del archivo generado
    steps:
      - uses: actions/checkout@v4

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: YeshuaChavez
          token: ${{ secrets.GITHUB_TOKEN }}
          file: trophy.svg
          theme: nord

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || (git commit -m "Update trophy SVG" && git push)
